[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ai-bridge"
version = "1.0.0"
description = "Universal Meta (Facebook & Instagram) CLI bridge for AI coding assistants (Claude Code, Cursor, Cline, Copilot)"
readme = "README.md"
authors = [{ name = "Anton Lisitskyi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[project.scripts]
meta = "meta_ai.cli:main"
fbads = "meta_ai.cli:main"
meta-ads = "meta_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
